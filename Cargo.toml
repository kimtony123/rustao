[package]
name = "rustao"
version = "0.2.0"
edition = "2021"
authors = ["Antony Kim <kimtony123@gmail.com>"]
description = "Rust SDK for the AO protocol on Arweave"
license = "MIT"
readme = "README.md"
repository = "https://github.com/kimtony123/rustao"
homepage = "https://github.com/kimtony123/rustao"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
base64 = "0.21"
rsa = "0.9"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
crypto-common = "0.1"
base58 = "0.2"
num-bigint-dig = "0.8"   # needed for JWK parsing

[dev-dependencies]
tokio-test = "0.4"
